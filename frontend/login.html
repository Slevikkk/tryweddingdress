<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Try Wedding Dress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">Try Wedding Dress</a>
            <div class="nav-links">
                <a href="/" class="nav-ghost">Главная</a>
                <a href="/signup.html" class="nav-cta">Регистрация</a>
            </div>
        </div>
    </nav>

    <div class="auth-shell">
        <div class="auth-card">
            <h1>С возвращением</h1>
            <p class="auth-subtitle">Войдите, чтобы посмотреть историю примерок.</p>

            <div id="error-box" class="auth-error" role="alert"></div>
            <div id="info-box" class="auth-info" role="status"></div>

            <form id="login-form" class="auth-form" novalidate>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div>
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>

            <p class="auth-footer">
                <a href="#" id="forgot-link">Забыли пароль?</a>
            </p>
            <p class="auth-footer" style="margin-top:8px;">
                Нет аккаунта? <a href="/signup.html">Зарегистрироваться</a>
            </p>
        </div>
    </div>

    <footer>
        <p>На технологии AI &middot; Фото обрабатываются безопасно и не хранятся постоянно</p>
        <p style="margin-top:8px;">
            <a href="/pricing.html" style="color:inherit;">Тарифы</a>
            &nbsp;&middot;&nbsp;
            <a href="/offer.html" style="color:inherit;">Оферта</a>
            &nbsp;&middot;&nbsp;
            <a href="/contacts.html" style="color:inherit;">Контакты</a>
            &nbsp;&middot;&nbsp;
            <a href="/privacy.html" style="color:inherit;">Конфиденциальность</a>
            &nbsp;&middot;&nbsp;
            <a href="/terms.html" style="color:inherit;">Правила</a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        var qs = new URLSearchParams(window.location.search);
        var errorBox = document.getElementById('error-box');
        var infoBox = document.getElementById('info-box');

        if (qs.get('confirmed') === '1') {
            infoBox.textContent = 'Email подтверждён. Теперь вы можете войти.';
            infoBox.classList.add('visible');
        } else if (qs.get('reset') === '1') {
            infoBox.textContent = 'Пароль обновлён. Войдите с новым паролем.';
            infoBox.classList.add('visible');
        } else if (qs.get('reset_sent') === '1') {
            infoBox.textContent = 'Проверьте почту — мы отправили ссылку для сброса пароля.';
            infoBox.classList.add('visible');
        }

        (async function () {
            var session = await window.TWD_AUTH.getSession();
            if (session) {
                var next = qs.get('next') || '/dashboard.html';
                window.location.replace(next);
            }
        })();

        var form = document.getElementById('login-form');
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.classList.remove('visible'); errorBox.textContent = '';
            infoBox.classList.remove('visible'); infoBox.textContent = '';

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            var btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Входим…';

            var resp = await window.TWD_AUTH.signIn(email, password);

            btn.disabled = false;
            btn.textContent = 'Войти';

            if (resp.error) {
                errorBox.textContent = resp.error.message || 'Не удалось войти. Проверьте email и пароль.';
                errorBox.classList.add('visible');
                return;
            }

            var next = qs.get('next') || '/dashboard.html';
            window.location.href = next;
        });

        document.getElementById('forgot-link').addEventListener('click', async function (e) {
            e.preventDefault();
            errorBox.classList.remove('visible'); errorBox.textContent = '';
            infoBox.classList.remove('visible'); infoBox.textContent = '';
            var email = document.getElementById('email').value.trim();
            if (!email) {
                errorBox.textContent = 'Сначала введите email выше, потом нажмите «Забыли пароль» ещё раз.';
                errorBox.classList.add('visible');
                return;
            }
            var resp = await window.TWD_AUTH.resetPassword(email);
            if (resp.error) {
                errorBox.textContent = resp.error.message || 'Не удалось отправить письмо. Попробуйте ещё раз.';
                errorBox.classList.add('visible');
                return;
            }
            infoBox.textContent = 'Если для ' + email + ' есть аккаунт, мы отправили ссылку для сброса пароля.';
            infoBox.classList.add('visible');
        });
    </script>
</body>
</html>
