<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password — Try Wedding Dress</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">Try Wedding Dress</a>
            <div class="nav-links">
                <a href="/" class="nav-ghost">Home</a>
                <a href="/login.html" class="nav-ghost">Log in</a>
            </div>
        </div>
    </nav>

    <div class="auth-shell">
        <div class="auth-card">
            <h1>Set a new password</h1>
            <p class="auth-subtitle">Choose a new password for your Try Wedding Dress account.</p>

            <div id="error-box" class="auth-error" role="alert"></div>
            <div id="info-box" class="auth-info" role="status"></div>

            <form id="reset-form" class="auth-form" novalidate>
                <div>
                    <label for="password">New password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div>
                    <label for="password_confirm">Confirm new password</label>
                    <input type="password" id="password_confirm" name="password_confirm" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn-primary">Update password</button>
            </form>

            <p class="auth-footer">
                Remembered your password? <a href="/login.html">Log in</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        var form = document.getElementById('reset-form');
        var errorBox = document.getElementById('error-box');
        var infoBox = document.getElementById('info-box');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('visible');
            infoBox.classList.remove('visible');
        }
        function showInfo(msg) {
            infoBox.textContent = msg;
            infoBox.classList.add('visible');
            errorBox.classList.remove('visible');
        }

        // Reset-password is only meaningful inside a recovery session. If the
        // user lands here without one (e.g. typed the URL manually, or the
        // recovery link expired and they got logged out), point them at the
        // login page where they can request a fresh email.
        (async function () {
            // Wait one tick for Supabase's detectSessionInUrl to consume the hash.
            await new Promise(function (r) { setTimeout(r, 50); });
            var session = await window.TWD_AUTH.getSession();
            if (!session) {
                showError(
                    'This password-reset link is no longer valid. Request a new one from the ' +
                    'login page using "Forgot password".'
                );
                form.querySelector('button[type="submit"]').disabled = true;
            }
        })();

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            errorBox.classList.remove('visible'); errorBox.textContent = '';
            infoBox.classList.remove('visible'); infoBox.textContent = '';

            var password = document.getElementById('password').value;
            var confirm = document.getElementById('password_confirm').value;

            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }
            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            var btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Updating…';

            var resp = await window.TWD_AUTH.updatePassword(password);

            btn.disabled = false;
            btn.textContent = 'Update password';

            if (resp.error) {
                showError(resp.error.message || 'Could not update your password. Try again.');
                return;
            }

            showInfo('Password updated. Redirecting you to your dashboard…');
            setTimeout(function () {
                window.location.replace('/dashboard.html');
            }, 1200);
        });
    </script>
</body>
</html>
